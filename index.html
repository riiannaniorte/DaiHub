<h2 class="h3">Novedades y Estrenos</h2>
<section class="anime-list" id="contenedor-2026" aria-live="polite"></section>

        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>
</footer>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');
        const contenedor = document.getElementById('contenedor-2026');

        if (nombreUsuarioLink) {
            if (usuarioActual) {
                nombreUsuarioLink.textContent = usuarioActual;
                nombreUsuarioLink.setAttribute('aria-label', `Usuario actual: ${usuarioActual}`);
            }
        }

        if (menuAdmin && usuarioActual !== 'admin') {
            menuAdmin.style.display = 'none';
        }

        if (contenedor) {
            cargarElementosInicio();
        }
    });

    const sheetDbUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';

    function cargarElementosInicio() {
        const contenedor = document.getElementById('contenedor-2026');

        if (!contenedor) {
            return;
        }

        fetch(sheetDbUrl)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`Error en la petición: ${res.status}`);
                }
                return res.json();
            })
            .then(datos => {
                contenedor.innerHTML = '';
                let hayRegistros = false;

                datos.forEach(item => {
                    if (!item || !item.titulo) return;

                    const titulo = String(item.titulo).trim();
                    const categoria = item.categoria ? String(item.categoria).trim() : 'N/A';
                    const rutaImagen = item.imagen ? String(item.imagen).trim() : 'imagenes/anime/default.jpg';
                    const linkDetalle = `informacion.html?titulo=${encodeURIComponent(titulo)}`;

                    const card = document.createElement('article');
                    card.className = 'anime-card news-card';

                    const imagenLink = document.createElement('a');
                    imagenLink.href = linkDetalle;
                    imagenLink.setAttribute('aria-label', `Ver información de ${titulo}`);

                    const imagen = document.createElement('img');
                    imagen.src = rutaImagen;
                    imagen.alt = titulo;
                    imagen.className = 'anime-img';
                    imagen.loading = 'lazy';
                    imagen.onerror = function() {
                        this.src = 'imagenes/anime/default.jpg';
                    };

                    const title = document.createElement('h3');
                    title.className = 'anime-title';
                    title.textContent = titulo;

                    const genre = document.createElement('p');
                    genre.className = 'anime-genre';
                    genre.textContent = `Categoría: ${categoria}`;

                    imagenLink.appendChild(imagen);
                    card.appendChild(imagenLink);
                    card.appendChild(title);
                    card.appendChild(genre);
                    contenedor.appendChild(card);
                    hayRegistros = true;
                });

                if (!hayRegistros) {
                    contenedor.innerHTML = '<p style="color: white; padding: 10px;">No hay registros disponibles.</p>';
                }
            })
            .catch(err => {
                console.error('Error al cargar los elementos de inicio:', err);
                contenedor.innerHTML = '<p style="color: white; padding: 10px;">No se pudieron cargar los elementos.</p>';
            });
    }
</script>

</body>
</html>
